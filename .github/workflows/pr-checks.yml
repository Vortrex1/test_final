name: PR Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  DOTNET_VERSION: '8.0.x'
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: hoteldb
  POSTGRES_PORT: 5432

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check PR title
        run: |
          if [[ ! "${{ github.event.pull_request.title }}" =~ ^(feat|fix|docs|style|refactor|perf|test|chore)(\([a-z]+\))?!?: ]]; then
            echo "PR title must follow conventional commit format"
            exit 1
          fi
      
      - name: Check for changes
        run: |
          if [ -z "$(git diff --name-only origin/main HEAD)" ]; then
            echo "No changes detected"
            exit 1
          fi

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      - validate-pr
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - ${{ env.POSTGRES_PORT }}:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p ${{ env.POSTGRES_PORT }}; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
      
      - name: Restore NuGet packages
        run: dotnet restore
      
      - name: Build project
        run: dotnet build --configuration Release --no-restore
      
      - name: Run all tests
        run: dotnet test HotelBooking.Tests/HotelBooking.Tests.csproj --configuration Release --no-build --logger "trx"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=${{ env.POSTGRES_PORT }};Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}"
      
      - name: Test Results Summary
        if: always()
        run: echo "All tests have been executed. Check the logs above for results."
