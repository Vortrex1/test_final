name: Code Quality

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore NuGet packages
        run: dotnet restore
      
      - name: Analyze code
        run: dotnet build --no-restore -c Release --nologo /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=false
      
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true
